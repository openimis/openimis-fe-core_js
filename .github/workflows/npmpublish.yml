# This workflow publishes the package to npmjs and GitHub Packages when a release is created
# The steps live in the shared workflow openimis/openimis-fe_js/.github/workflows/module-npmpublish.yml
# npmjs uses trusted publishing: this file (npmpublish.yml) is the trusted publisher configured
# for the package on npmjs.com, so keep its name.

name: Publish Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node version to use'
        required: true
        default: '24'
      scope:
        description: 'Scope for npm package'
        required: false
        default: 'openimis'
      access:
        description: 'Access level for npm package'
        required: false
        default: 'public'
      tag:
        description: 'Optional dist-tag for the published package (e.g., latest, beta)'
        required: false

jobs:
  call-npm-publish-workflow:
    permissions:
      contents: read
      id-token: write
    uses: openimis/openimis-fe_js/.github/workflows/module-npmpublish.yml@develop
    with:
      registry_url: 'https://registry.npmjs.org/'
      node_version: ${{ github.event.inputs.node_version || '24' }}
      access: ${{ github.event.inputs.access || 'public' }}
      scope: ${{ github.event.inputs.scope || 'openimis' }}
      tag: ${{ github.event.inputs.tag }}
  call-gpr-publish-workflow:
    permissions:
      contents: read
      packages: write
    uses: openimis/openimis-fe_js/.github/workflows/module-npmpublish.yml@develop
    with:
      registry_url: 'https://npm.pkg.github.com/'
      node_version: ${{ github.event.inputs.node_version || '24' }}
      access: ${{ github.event.inputs.access || 'public' }}
      scope: ${{ github.event.inputs.scope || 'openimis' }}
      tag: ${{ github.event.inputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
